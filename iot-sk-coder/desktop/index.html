<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync - SaaS Landing Page</title>
    <style>
        body {
            font-family: 'sohne-var', Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #061b31;
            background-color: #ffffff;
        }
        header {
            text-align: center;
            padding: 96px 20px;
            background-color: #f8f8f8;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 30px 45px -30px;
        }
        h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: -1.4px;
        }
        p {
            font-size: 18px;
            line-height: 1.4;
        }
        .cta {
            background-color: #533afd;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 400;
            font-size: 16px;
        }
        .features, .pricing {
            padding: 40px 20px; 
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .feature, .price {
            background: #fff;
            border: 1px solid #e5edf5;
            border-radius: 6px;
            padding: 20px;
            margin: 10px;
            width: 300px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 15px 30px -15px, rgba(0, 0, 0, 0.1) 0px 8px 16px -8px;
        }
        .footer {
            background-color: #1c1e54;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>FlowSync</h1>
        <p>Ship faster, together.</p>
        <button class="cta">Get Started</button>
        <button class="cta">Learn More</button>
    </header>

    <section class="features">
        <div class="feature">
            <h2>Feature 1</h2>
            <p>Description of feature 1.</p>
        </div>
        <div class="feature">
            <h2>Feature 2</h2>
            <p>Description of feature 2.</p>
        </div>
        <div class="feature">
            <h2>Feature 3</h2>
            <p>Description of feature 3.</p>
        </div>
    </section>

    <section class="pricing">
        <div class="price">
            <h2>Basic</h2>
            <p>$10/month</p>
            <button class="cta">Choose Plan</button>
        </div>
        <div class="price">
            <h2>Pro</h2>
            <p>$20/month</p>
            <button class="cta">Choose Plan</button>
        </div>
    </section>

    <footer class="footer">
        <p>Join thousands of users today!</p>
        <p>&copy; 2023 FlowSync. All rights reserved.</p>
    </footer>
</body>
</html>
